version = 2

[workspace]
id = "one-cli"
name = "One CLI"

[projects.cli]
path = "packages/cli"
toolchain = "go"

[projects.one-core]
path = "packages/one-core"
toolchain = "go"

[projects.desktop-api]
path = "services/desktop-api"
toolchain = "go"

[projects.desktop-renderer]
path = "apps/desktop-renderer"
toolchain = "node"

[projects.website]
path = "apps/website"
toolchain = "node"

[projects.desktop-main]
path = "services/desktop-main"
toolchain = "node"

[projects.desktop-preload]
path = "packages/desktop-preload"
toolchain = "node"

[groups.desktop]
projects = ["desktop-renderer", "desktop-main", "desktop-preload"]
