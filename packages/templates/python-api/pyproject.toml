[project]
name = "one-template-python-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "one_template_python_api"

[tool.one.tasks.dev]
description = "Run the Python HTTP service / 运行 Python HTTP 服务"
run = ["python", "-m", "one_template_python_api"]

[tool.one.tasks.check]
description = "Check Python syntax / 检查 Python 语法"
run = ["python", "-m", "compileall", "-q", "src"]

[tool.one.tasks.test]
description = "Run Python tests / 运行 Python 测试"
run = ["python", "-m", "unittest", "discover"]

[tool.one.tasks.build]
description = "Build Python distributions / 构建 Python 分发包"
run = ["uv", "build", "--package", "one-template-python-api", "--out-dir", "dist"]
