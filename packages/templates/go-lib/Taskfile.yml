version: "3"

tasks:
  build:
    cmds:
      - go build {{.CLI_ARGS}} ./...

  fmt:
    cmds:
      - gofmt -w .

  fmt:check:
    cmds:
      - test -z "$(gofmt -l .)"

  vet:
    cmds:
      - go vet ./...

  tidy:
    cmds:
      - go mod tidy

  check:
    cmds:
      - task: fmt:check
      - task: vet
