openapi: 3.0.3
info:
  title: Go API
  version: 0.1.0
  description: Application information and health / 服务信息与健康检查
paths:
  /:
    get:
      summary: Application information / 服务信息
      responses:
        "200":
          description: Application name and version
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
  /health:
    get:
      summary: Liveness check / 存活检查
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
