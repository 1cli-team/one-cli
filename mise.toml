min_version = "2026.9.7"
monorepo_root = true

[tools]
go = "1.27.1"
node = "24.21.0"
pnpm = "12.3.4"
task = "3.53.1"
process-compose = "1.122.0"

[tasks.release]
description = "Plan, build, or publish a release / 规划、打包或发布版本"
run = "node scripts/release.mts"
raw_args = true

[tasks."release:check"]
description = "Check release state and artifact rules / 检查发布状态与产物规则"
run = "node scripts/release-rules.test.mts"

[tasks.install-deps]
description = "Install the root pnpm workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.build-web]
description = "Build the desktop React interface"
depends = ["install-deps"]
dir = "apps/desktop"
run = "pnpm run build:web"
sources = ["src/**/*", "index.html", "package.json", "vite.config.ts", "tsconfig*.json", "../../package.json", "../../pnpm-lock.yaml", "../../pnpm-workspace.yaml"]
outputs = ["dist"]

[tasks.sync-bundled]
description = "Refresh embedded templates and registry"
dir = "packages/cli"
run = "task sync-bundled"

[tasks."process-compose:inspect"]
description = "Inspect the official Process Compose runtime installed by mise"
run = ["mise registry process-compose", "process-compose version --short", "process-compose up --help", "mise env --help"]


[tasks.build]
description = "Build One CLI with all embedded resources"
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task build"

[tasks.build-local]
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task build-local"

[tasks.build-all]
description = "Cross compile every supported target"
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task build-all"

[tasks.verify-docs]
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task verify-docs"

[tasks.verify-node-workspace]
dir = "packages/cli"
run = "task verify-node-workspace"

[tasks.gen-error-codes]
dir = "packages/cli"
run = "task gen-error-codes"

[tasks."check:go"]
depends = ["kernel:check", "cli:check", "one-core:check", "desktop-api:check"]

[tasks."check:desktop-ui"]
depends = ["install-deps"]
dir = "apps/desktop"
run = "pnpm run check"

[tasks."check:static"]
description = "Check documentation, Go, React, and Tauri"
depends = ["verify-node-workspace", "verify-docs", "check:go", "check:desktop-ui", "release:check", "check:desktop"]

[tasks.check]
description = "Run static checks on the current platform"
depends = ["check:static"]

[tasks.fmt]
depends = ["kernel:fmt", "cli:fmt", "one-core:fmt", "desktop-api:fmt"]

[tasks."fmt:check"]
run = "go run ./packages/cli/tools/repo-checks gofmt"

[tasks.vet]
depends = ["check:go"]

[tasks.tidy]
depends = ["kernel:tidy", "cli:tidy", "one-core:tidy", "desktop-api:tidy"]
run = "go work sync"

[tasks.install]
description = "Build and install a local One launcher"
depends = ["build-local"]
run = "task -d packages/cli install-launcher"

# Compatibility task names use the same project entries.
# 兼容旧入口，统一复用项目任务。

[tasks.dev]
description = "Run One Desktop with its bundled Go API and CLI"
depends = ["install-deps"]
run = "node scripts/desktop.mts dev"

[tasks."docs:dev"]
depends = ["install-deps"]
dir = "apps/docs"
run = "pnpm run dev"
raw_args = true

[tasks."docs:build"]
depends = ["install-deps"]
dir = "apps/docs"
run = "pnpm run build"
raw_args = true

[monorepo]
config_roots = ["."]
lockfile = false

# Project task prerequisites and overrides.
# 子项目任务的前置步骤和覆盖统一放在根目录。

[tasks."cli:build"]
depends = ["//:sync-bundled"]

description = 'Build One after mise has prepared embedded resources'
dir = 'packages/cli'
raw_args = true
run = 'task build --'

[tasks."cli:build-local"]
depends = ["//:sync-bundled"]

dir = 'packages/cli'
raw_args = true
run = 'task build-local --'

[tasks."cli:build-all"]
depends = ["//:sync-bundled"]

description = 'Cross compile the supported release targets'
dir = 'packages/cli'
raw_args = true
run = 'task build-all --'

[tasks."cli:check"]
depends = ["//:sync-bundled"]

dir = 'packages/cli'
raw_args = true
run = 'task check --'


[tasks."cli:verify-docs"]
depends = ["//:sync-bundled"]

dir = 'packages/cli'
raw_args = true
run = 'task verify-docs --'

[tasks."cli:gen-error-codes"]
depends = ["//:sync-bundled"]

dir = 'packages/cli'
raw_args = true
run = 'task gen-error-codes --'


[tasks."cli:install-launcher"]
depends = ["//:build-local"]

dir = 'packages/cli'
raw_args = true
run = 'task install-launcher --'

[tasks.'cli:fmt']
dir = 'packages/cli'
raw_args = true
run = 'task fmt --'

[tasks.'cli:sync-bundled']
dir = 'packages/cli'
raw_args = true
run = 'task sync-bundled --'

[tasks.'cli:tidy']
dir = 'packages/cli'
raw_args = true
run = 'task tidy --'

[tasks.'cli:verify-node-workspace']
dir = 'packages/cli'
raw_args = true
run = 'task verify-node-workspace --'

[tasks.'desktop:build']
depends = ["//:install-deps"]
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run build'

[tasks.'desktop:check']
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run check'

[tasks.'desktop:check:fix']
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run check:fix'

[tasks.'desktop:dev']
depends = ["//:install-deps"]
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run dev'

[tasks.'desktop:format']
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run format'

[tasks.'desktop:format:fix']
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run format:fix'

[tasks.'desktop:lint']
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run lint'

[tasks.'desktop:lint:fix']
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run lint:fix'

[tasks.'desktop:preview']
dir = 'apps/desktop'
raw_args = true
run = 'pnpm run preview'

[tasks.'docs:postinstall']
dir = 'apps/docs'
raw_args = true
run = 'pnpm run postinstall'

[tasks.'docs:start']
dir = 'apps/docs'
raw_args = true
run = 'pnpm run start'

[tasks.'kernel:build']
dir = 'packages/kernel'
raw_args = true
run = 'task build --'

[tasks.'kernel:check']
dir = 'packages/kernel'
raw_args = true
run = 'task check --'

[tasks.'kernel:fmt']
dir = 'packages/kernel'
raw_args = true
run = 'task fmt --'

[tasks.'kernel:tidy']
dir = 'packages/kernel'
raw_args = true
run = 'task tidy --'



[tasks."desktop:prepare"]
depends = ["sync-bundled"]
run = "node scripts/desktop.mts prepare"

[tasks."check:desktop"]
depends = ["desktop:prepare"]
run = ["cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check", "cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml"]

[tasks."build-desktop"]
depends = ["install-deps"]
run = "node scripts/desktop.mts build"
raw_args = true

[tasks."one-core:check"]
depends = ["//:sync-bundled"]
dir = "packages/one-core"
run = "task check"

[tasks."desktop-api:check"]
depends = ["//:sync-bundled"]
dir = "services/desktop-api"
run = "task check"

[tasks.'desktop-api:build']
depends = ["//:sync-bundled"]
dir = 'services/desktop-api'

raw_args = true

run = 'task build --'

[tasks.'desktop-api:fmt']
dir = 'services/desktop-api'

raw_args = true

run = 'task fmt --'

[tasks.'desktop-api:tidy']
dir = 'services/desktop-api'

raw_args = true

run = 'task tidy --'

[tasks.'desktop:build:web']
dir = 'apps/desktop'

raw_args = true

run = 'pnpm run build:web'

[tasks.'desktop:check:native']
depends = ["//:desktop:prepare", "//:install-deps"]
dir = 'apps/desktop'

raw_args = true

run = 'pnpm run check:native'

[tasks.'desktop:dev:web']
dir = 'apps/desktop'

raw_args = true

run = 'pnpm run dev:web'

[tasks.'desktop:prepare:backend']
dir = 'apps/desktop'

raw_args = true

run = 'pnpm run prepare:backend'

[tasks.'one-core:build']
depends = ["//:sync-bundled"]
dir = 'packages/one-core'

raw_args = true

run = 'task build --'

[tasks.'one-core:fmt']
dir = 'packages/one-core'

raw_args = true

run = 'task fmt --'

[tasks.'one-core:tidy']
dir = 'packages/one-core'

raw_args = true

run = 'task tidy --'

