[tasks."cli:gen-error-codes"]
depends = ["//:sync-bundled", "//:sync-web"]

dir = 'packages/cli'
raw_args = true
run = 'task gen-error-codes --'

[tasks."cli:test"]
depends = ["//:build"]

dir = 'packages/cli'
raw_args = true
run = 'task test --'

[tasks."cli:test:race"]
depends = ["//:build"]

dir = 'packages/cli'
raw_args = true
run = 'task test:race --'

[tasks."cli:test:snapshot"]
depends = ["//:build"]

dir = 'packages/cli'
raw_args = true
run = 'task test:snapshot --'

[tasks."cli:sync-web"]
depends = ["//:build-web"]

dir = 'packages/cli'
raw_args = true
run = 'task sync-web --'

[tasks."cli:install-launcher"]
depends = ["//:build-local"]

dir = 'packages/cli'
raw_args = true
run = 'task install-launcher --'

[tasks."dashboard:dev".env]
VITE_DEV_API_TARGET = "http://127.0.0.1:5174"

[tasks.'cli:fmt']
dir = 'packages/cli'
