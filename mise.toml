min_version = "2026.9.7"
monorepo_root = true

[tools]
go = "1.27.1"
node = "24.15.0"
pnpm = "10.14.0"
task = "3.53.1"

[tasks.install-deps]
description = "Install the root pnpm workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.build-web]
description = "Build the embedded Dashboard"
depends = ["install-deps"]
dir = "apps/dashboard"
run = "pnpm run build"
sources = ["src/**/*", "index.html", "package.json", "vite.config.ts", "tsconfig*.json", "../../package.json", "../../pnpm-lock.yaml", "../../pnpm-workspace.yaml"]
outputs = ["dist"]

[tasks.sync-bundled]
description = "Refresh embedded templates and registry"
dir = "packages/cli"
run = "task sync-bundled"

[tasks.sync-web]
depends = ["build-web"]
dir = "packages/cli"
run = "task sync-web"

[tasks.build]
description = "Build One CLI with all embedded resources"
depends = ["sync-bundled", "sync-web"]
dir = "packages/cli"
run = "task build"

[tasks.build-local]
depends = ["sync-bundled", "sync-web"]
dir = "packages/cli"
run = "task build-local"

[tasks.build-all]
description = "Cross compile every supported target"
depends = ["sync-bundled", "sync-web"]
dir = "packages/cli"
run = "task build-all"

[tasks.verify-docs]
depends = ["sync-bundled", "sync-web"]
dir = "packages/cli"
run = "task verify-docs"

[tasks.verify-node-workspace]
dir = "packages/cli"
run = "task verify-node-workspace"

[tasks.gen-error-codes]
dir = "packages/cli"
run = "task gen-error-codes"

[tasks."check:go"]
depends = ["kernel:check", "cli:check"]

[tasks."check:dashboard"]
depends = ["install-deps"]
dir = "apps/dashboard"
run = "pnpm run check"

[tasks."check:static"]
description = "Check documentation, Go, and Dashboard"
depends = ["verify-node-workspace", "verify-docs", "check:go", "check:dashboard"]

[tasks."test:go:plain"]
depends = ["kernel:test", "cli:test"]

[tasks."test:go"]
depends = ["kernel:test:race", "cli:test:race"]

[tasks."test:dashboard"]
depends = ["build-web"]
dir = "apps/dashboard"
run = "pnpm run test"

[tasks."test:snapshot"]
depends = ["cli:test:snapshot"]

[tasks."check:test"]
depends = ["test:go:plain", "test:dashboard"]

[tasks.check]
description = "Run the complete local and CI gate"
depends = ["check:static", "check:test"]

[tasks."check:templates"]
description = "Build runnable template sources and generated Go/Electron projects"
depends = ["sync-bundled", "sync-web"]
run = "go test -count=1 -timeout=20m -v ./packages/cli/internal/modules/creation -run ^TestRunnableTemplateSourcesAndProjects$"
env = { ONE_TEST_TEMPLATE_BUILDS = "1" }

[tasks.ci]
depends = ["check"]

[tasks.test]
description = "Run Go race and Dashboard tests"
depends = ["test:go", "test:dashboard"]

[tasks.pre-push]
description = "Run the PR gate and Go race tests"
depends = ["check", "test:go"]

[tasks.fmt]
depends = ["kernel:fmt", "cli:fmt"]

[tasks."fmt:check"]
run = "go run ./packages/cli/tools/repo-checks gofmt"

[tasks.vet]
depends = ["check:go"]

[tasks.tidy]
depends = ["kernel:tidy", "cli:tidy"]
run = "go work sync"

[tasks."hooks:install"]
run = "git config --local core.hooksPath .githooks"

[tasks.install]
description = "Build a local One launcher and enable Git hooks"
depends = ["build-local"]
run = ["git config --local core.hooksPath .githooks", "task -d packages/cli install-launcher"]

# Compatibility task names use the same project entries.
# 兼容旧入口，统一复用项目任务。
[tasks."dev:serve"]
depends = ["cli:dev"]

[tasks."dev:dashboard"]
depends = ["dashboard:dev"]

[tasks.dev]
description = "Run the Go API and Vite Dashboard"
depends = ["cli:dev", "dashboard:dev"]

[tasks."docs:dev"]
depends = ["install-deps"]
dir = "apps/docs"
run = "pnpm run dev"
raw_args = true

[tasks."docs:build"]
depends = ["install-deps"]
dir = "apps/docs"
run = "pnpm run build"
raw_args = true

[monorepo]
config_roots = ["."]
lockfile = false

# Project task prerequisites and overrides.
# 子项目任务的前置步骤和覆盖统一放在根目录。

[tasks."cli:build"]
depends = ["//:sync-bundled", "//:sync-web"]

description = 'Build One after mise has prepared embedded resources'
dir = 'packages/cli'
raw_args = true
run = 'task build --'

[tasks."cli:build-local"]
depends = ["//:sync-bundled", "//:sync-web"]

dir = 'packages/cli'
raw_args = true
run = 'task build-local --'

[tasks."cli:build-all"]
