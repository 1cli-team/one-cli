min_version = "2026.9.7"
monorepo_root = true

[tools]
go = "1.27.1"
node = "24.21.0"
pnpm = "12.3.4"
task = "3.53.1"
process-compose = "1.122.0"

[tasks.release]
description = "Plan, build, or start a unified release / 规划、打包或启动统一发布"
run = "node scripts/release.mts"
raw_args = true

[tasks.desktop-release]
description = "Verify or complete a unified release / 校验或完成统一发布"
run = "node scripts/desktop-release.mts"
raw_args = true

[tasks.install-deps]
description = "Install the root pnpm workspace dependencies"
run = ["pnpm install --frozen-lockfile", "node scripts/desktop-electron-install.mts"]

[tasks.build-web]
description = "Build the desktop React interface"
depends = ["install-deps"]
dir = "apps/desktop-renderer"
run = "pnpm run build:web"
sources = ["src/**/*", "index.html", "package.json", "vite.config.ts", "tsconfig*.json", "../../package.json", "../../pnpm-lock.yaml", "../../pnpm-workspace.yaml"]
outputs = ["dist"]

[tasks.sync-bundled]
description = "Refresh embedded templates and registry"
dir = "packages/cli"
run = "task sync-bundled"

[tasks."process-compose:inspect"]
description = "Inspect the official Process Compose runtime installed by mise"
run = ["mise registry process-compose", "process-compose version --short", "process-compose up --help", "mise env --help"]


[tasks.build]
description = "Build One CLI with all embedded resources"
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task build"

[tasks.build-local]
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task build-local"

[tasks.build-all]
description = "Cross compile every supported target"
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task build-all"

[tasks.verify-guidance]
depends = ["sync-bundled"]
dir = "packages/cli"
run = "task verify-guidance"

[tasks.verify-node-workspace]
dir = "packages/cli"
run = "task verify-node-workspace"

[tasks."check:go"]
depends = ["cli:check", "one-core:check", "desktop-api:check"]

[tasks."check:desktop-ui"]
depends = ["install-deps"]
dir = "apps/desktop-renderer"
run = "pnpm run check"

[tasks."check:website"]
depends = ["install-deps"]
dir = "apps/website"
run = "pnpm run check"

[tasks."check:static"]
description = "Check agent guidance, website, Go, React, and Electron"
depends = ["verify-node-workspace", "verify-guidance", "check:go", "check:desktop-ui", "check:website", "check:desktop"]

[tasks.check]
description = "Run static checks on the current platform"
depends = ["check:static"]

[tasks.fmt]
depends = ["cli:fmt", "one-core:fmt", "desktop-api:fmt"]

[tasks."linear:check"]
description = "Verify the Linear plugin, project bindings, CLI and HTTP API"
depends = ["sync-bundled"]
run = ["go vet ./packages/one-core/pkg/plugins/linear ./packages/one-core/pkg/modules/issuetracking ./packages/cli/internal/plugins/linear ./services/desktop-api/internal/http", "go test -race ./packages/one-core/pkg/plugins/linear ./packages/one-core/pkg/modules/issuetracking ./packages/cli/internal/plugins/linear ./services/desktop-api/internal/http"]

[tasks."git:check"]
description = "Verify Git branches, worktrees, CLI and HTTP API"
depends = ["sync-bundled"]
run = ["go vet ./packages/one-core/pkg/plugins/git ./packages/one-core/pkg/modules/git ./packages/cli/internal/plugins/git ./services/desktop-api/internal/http", "go test -race ./packages/one-core/pkg/plugins/git ./packages/one-core/pkg/modules/git ./packages/cli/internal/plugins/git ./services/desktop-api/internal/http"]

[tasks."fmt:check"]
run = "go run ./packages/cli/tools/repo-checks gofmt"

[tasks.vet]
depends = ["check:go"]

[tasks.tidy]
depends = ["cli:tidy", "one-core:tidy", "desktop-api:tidy"]
run = "go work sync"

[tasks.install]
description = "Build and install a local One launcher"
depends = ["build-local"]
run = "task -d packages/cli install-launcher"

# Compatibility task names use the same project entries.
# 兼容旧入口，统一复用项目任务。

[tasks.dev]
description = "Run One Desktop with its bundled Go API and CLI"
depends = ["install-deps"]
run = "node scripts/desktop.mts dev"

[monorepo]
config_roots = ["."]
lockfile = false

