# goreleaser config for the Go rewrite of one-cli.
#
# Cuts cross-platform binaries on every git tag, packs them into per-target
# tarballs/zips, and uploads them to a GitHub Release. install.sh downloads
# the matching tarball from those release assets at install time.
#
# Run locally:    goreleaser release --snapshot --clean
# Run on tag:     goreleaser release --clean    (CI / release pipeline)
#
# The release workflow computes RELEASE_VERSION and creates its local tag.
# GoReleaser derives .Version from that tag and injects it through
# ldflags, so no tracked version file needs to change before a release.

version: 2

project_name: one-cli

builds:
  - id: one
    dir: packages/cli
    main: ./cmd/one
    binary: one
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # No need for windows/arm64 yet — too few users.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # install.sh resolves binaries by archive name. Keep the template shape
    # (one-cli_{os}_{arch}) stable so older installers keep working when we
    # cut newer releases.
    name_template: "one-cli_{{ .Os }}_{{ .Arch }}"
    files:
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # We keep CHANGELOG.md authoritative. goreleaser's auto-generated entries
  # are noisy and conflict with the curated narrative.
  disable: true

release:
  # install.sh downloads from <repo>/releases/download/<tag>/<asset> so the
  # exact GitHub repo coordinates here matter. Adjust if the repo moves.
  github:
    owner: 1cli-team
    name: one-cli
  draft: true
  # A failed publish may already have created the tag and part of its draft.
  # Reuse that draft and replace duplicate assets so the publish operation is
  # safe to retry instead of silently skipping to the next version.
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: true
  prerelease: auto
  header: |
    # one-cli {{ .Tag }}

    Pre-built binaries for darwin/linux/windows × amd64/arm64.
    Install via the curl one-liner (see README), or download the
    matching archive below and extract `one` onto your PATH.

  footer: |
    Verify your download with `sha256sum -c checksums.txt`.
