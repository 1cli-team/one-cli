# Build the docs site for PR/push confidence. Production deploys are handled
# by the Vercel project linked to apps/docs and the 1cli.dev domain.

name: Documentation Build

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "packages/templates/registry.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "packages/templates/registry.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.7
          experimental: false

      - name: Build docs site
        run: mise run docs:build
