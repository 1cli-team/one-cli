# PR-time test gate with native Linux, Windows, macOS, and Go race coverage.
#
# Two PR jobs call the same subtasks used by the local `mise run check` entrypoint:
#  - lint: `mise run check:static` covers documentation drift, Go vet/gofmt, and
#    Dashboard lint/format. The whole bundled
#    tree (registry/_templates/_web) is gitignored and regenerated
#    via `mise run sync-bundled` + `mise run sync-web`, both of which run as deps
#    of `mise run vet` — so vet implicitly bootstraps the bundle here.
#  - test: `mise run check:test` builds bin/one then runs Go + Dashboard tests.
#    Build is required because tests/e2e snapshot tests skip when
#    bin/one is missing.
# Native Windows, macOS, and Go race jobs also run on every PR. The master
# ruleset requires lint, test, test-windows, test-macos, and test-race before merging.
#
# Both jobs need Node + pnpm because sync-web runs `pnpm install` +
# `vite build` against apps/dashboard/.
#
# Runners:
#   - ubuntu-latest for the main PR checks
#   - windows-latest for native Windows build and test coverage
#   - macos-latest for native macOS build and test coverage

name: Code Quality and Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_CACHE: "off"
  # GitHub-hosted runners are outside China; the default Go proxy
  # (goproxy.cn) is slower/flakier there and has caused CI download failures.
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.7
          experimental: false

      - name: Download Go modules
        run: |
          GOWORK=off go -C packages/kernel mod download
          GOWORK=off go -C packages/cli mod download

      - name: Verify dependency metadata is clean
        run: |
          set -euo pipefail
          dependency_files=(
            go.work
            go.work.sum
            packages/kernel/go.mod
            packages/kernel/go.sum
            packages/cli/go.mod
            packages/cli/go.sum
          )
          changes="$(git status --short -- "${dependency_files[@]}")"
          if [[ -n "$changes" ]]; then
            echo "Dependency setup changed dependency metadata." >&2
            printf '%s\n' "$changes" >&2
            git diff -- "${dependency_files[@]}"
            exit 1
          fi

      - name: Run static gate
        # Calls the same static subtask as local `mise run check`.
        run: mise run check:static

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.7
          experimental: false

      - name: Download Go modules
        run: |
          GOWORK=off go -C packages/kernel mod download
          GOWORK=off go -C packages/cli mod download

      - name: Verify dependency metadata is clean
        run: |
          set -euo pipefail
          dependency_files=(
            go.work
            go.work.sum
            packages/kernel/go.mod
            packages/kernel/go.sum
            packages/cli/go.mod
            packages/cli/go.sum
          )
          changes="$(git status --short -- "${dependency_files[@]}")"
          if [[ -n "$changes" ]]; then
            echo "Dependency setup changed dependency metadata." >&2
            printf '%s\n' "$changes" >&2
            git diff -- "${dependency_files[@]}"
            exit 1
          fi

      - name: Run test gate
        # Avoid running Go builds/tests alongside jsdom on the same runner.
        run: mise run --jobs 1 check:test

      - name: Build template sources and generated projects
        run: mise run check:templates

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.7
          experimental: false

      - name: Download Go modules
        shell: pwsh
        run: |
          $env:GOWORK = "off"
          go -C packages/kernel mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C packages/cli mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native Windows PR gate
        run: mise run --jobs 1 check

  test-race:
    # Catch Go data races before merging, alongside the other required jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.7
          experimental: false

      - name: Download Go modules
        run: |
          GOWORK=off go -C packages/kernel mod download
          GOWORK=off go -C packages/cli mod download

      - name: Verify dependency metadata is clean
        run: |
          set -euo pipefail
          dependency_files=(
            go.work
            go.work.sum
            packages/kernel/go.mod
            packages/kernel/go.sum
            packages/cli/go.mod
            packages/cli/go.sum
          )
          changes="$(git status --short -- "${dependency_files[@]}")"
          if [[ -n "$changes" ]]; then
            echo "Dependency setup changed dependency metadata." >&2
            printf '%s\n' "$changes" >&2
            git diff -- "${dependency_files[@]}"
            exit 1
          fi

      - name: Run Go race tests
        # test:go builds the CLI for E2E coverage; Dashboard tests run in test.
        run: mise run test:go

  test-macos:
    # Run before merging so macOS path and process regressions block PRs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.7
          experimental: false

      - name: Download Go modules
        run: |
          GOWORK=off go -C packages/kernel mod download
          GOWORK=off go -C packages/cli mod download

      - name: Verify dependency metadata is clean
        run: |
          set -euo pipefail
          dependency_files=(
            go.work
            go.work.sum
            packages/kernel/go.mod
            packages/kernel/go.sum
            packages/cli/go.mod
            packages/cli/go.sum
          )
          changes="$(git status --short -- "${dependency_files[@]}")"
          if [[ -n "$changes" ]]; then
            echo "Dependency setup changed dependency metadata." >&2
            printf '%s\n' "$changes" >&2
            git diff -- "${dependency_files[@]}"
            exit 1
          fi

      - name: Run test gate
        run: mise run --jobs 1 check:test
