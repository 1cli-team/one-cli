# Use with compose.yaml to mount the Infisical Client Secret at runtime.
services:
  server:
    environment:
      ONE_INFISICAL_CLIENT_SECRET: ""
      ONE_INFISICAL_CLIENT_SECRET_FILE: /run/secrets/infisical_client_secret
    secrets:
      - infisical_client_secret
secrets:
  infisical_client_secret:
    file: ${ONE_INFISICAL_CLIENT_SECRET_PATH:?Set the private host file containing the Infisical Client Secret}
